apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: app-alb-gateway
  namespace: default
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/certificate-arn: "${ACM_CERTIFICATE_ARN}"
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
  labels:
    app.kubernetes.io/name: app-alb-gateway
    app.kubernetes.io/part-of: online-boutique-platform
spec:
  gatewayClassName: aws-alb-gateway-class
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "shop.${DOMAIN_NAME}"
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway-access: app
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "shop.${DOMAIN_NAME}"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: acm-tls-certificate-ref
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway-access: app
---
