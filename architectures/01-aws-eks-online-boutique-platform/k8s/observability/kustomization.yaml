apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

commonLabels:
  app.kubernetes.io/managed-by: kustomize
  app.kubernetes.io/part-of: online-boutique-observability

resources:
  # Monitoring Pillar (Prometheus, Alertmanager -> Slack, Grafana)
  - monitoring/namespace.yaml
  - monitoring/prometheus.yaml
  - monitoring/alertmanager.yaml
  - monitoring/grafana.yaml
  # Logging Pillar (ECK Elasticsearch, Filebeat DaemonSet, Kibana)
  - logging/namespace.yaml
  - logging/eck-elasticsearch.yaml
  - logging/filebeat.yaml
  - logging/kibana.yaml
  # Tracing Pillar (Jaeger OTLP gRPC :4317 & Query UI :16686)
  - tracing/namespace.yaml
  - tracing/jaeger-otlp.yaml
