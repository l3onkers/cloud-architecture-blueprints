apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-image-updater-config
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-image-updater
    app.kubernetes.io/part-of: argocd
data:
  interval: "2m"
  log.level: "info"
  registries.conf: |
    registries:
      - name: GitHub Container Registry
        api_url: https://ghcr.io
        prefix: ghcr.io
        ping: yes
        credentials: pullsecret:argocd/ghcr-image-updater-secret
        defaultns: ${GITHUB_OWNER}
        ratelimit: 50
---
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-image-updater-secret
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-image-updater
    app.kubernetes.io/part-of: argocd
type: Opaque
stringData:
  credentials: "${GITHUB_OWNER}:${GHCR_PAT}"
