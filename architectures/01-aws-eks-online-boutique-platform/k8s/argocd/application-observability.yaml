apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: online-boutique-observability
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: online-boutique-platform
    layer: observability
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: online-boutique-project
  source:
    repoURL: https://github.com/${GITHUB_OWNER}/online-boutique-aws-platform.git
    targetRevision: main
    path: k8s/observability
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
