apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: online-boutique-platform-networking
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: online-boutique-platform
    layer: platform-networking
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: online-boutique-project
  sources:
    - repoURL: https://github.com/${GITHUB_OWNER}/online-boutique-aws-platform.git
      targetRevision: main
      path: k8s/platform
    - repoURL: https://github.com/${GITHUB_OWNER}/online-boutique-aws-platform.git
      targetRevision: main
      path: k8s/networking
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
