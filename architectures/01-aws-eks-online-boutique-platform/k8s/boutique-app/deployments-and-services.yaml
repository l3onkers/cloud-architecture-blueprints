kind: Deployment
metadata:
  name: loadgenerator
  namespace: boutique-app
  labels:
    app: loadgenerator
    app.kubernetes.io/name: loadgenerator
    app.kubernetes.io/part-of: online-boutique
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loadgenerator
  template:
    metadata:
      labels:
        app: loadgenerator
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: main
          image: gcr.io/google-samples/microservices-demo/loadgenerator:v0.10.1
          envFrom:
