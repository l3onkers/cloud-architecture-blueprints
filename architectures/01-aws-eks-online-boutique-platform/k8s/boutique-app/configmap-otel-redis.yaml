apiVersion: v1
kind: ConfigMap
metadata:
  name: boutique-otel-redis-config
  namespace: boutique-app
  labels:
    app.kubernetes.io/part-of: online-boutique
data:
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger-collector.tracing.svc.cluster.local:4317"
  OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
  OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=production,service.namespace=boutique-app"
  REDIS_ADDR: "${ELASTICACHE_REDIS_ENDPOINT}:6379"
